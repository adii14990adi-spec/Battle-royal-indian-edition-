name: Set up Godot + Android SDK
description: >-
  Everything a headless Godot Android export needs: JDK 17, the Android SDK
  (platform-tools, build-tools 34, platform 34), the Godot editor binary, the
  matching export templates, a debug keystore, and the editor settings that tell
  Godot where all of that lives. Cached, so a warm run costs a few seconds.

inputs:
  godot-version:
    description: Godot version to install, without the trailing "-stable".
    required: false
    default: "4.4.1"
  cache-revision:
    description: Bump this to invalidate the Godot binary + template cache.
    required: false
    default: "v2"
  android-build-tools:
    description: build-tools version to install and put on PATH.
    required: false
    default: "34.0.0"

runs:
  using: composite
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "17"

    # A notice, not an error: if setup-java dies this step never runs, so the
    # presence or absence of the notice in the run's annotations says which step
    # failed without needing the (usually unavailable) raw log.
    - name: Report Java
      shell: bash
      run: |
        set -uo pipefail
        echo "::notice::JAVA_HOME=${JAVA_HOME:-<unset>}"
        java -version 2>&1 | head -2 || echo "::warning::java is not on PATH"

    # continue-on-error + an explicit fallback: the GitHub images ship the SDK at
    # /usr/local/lib/android/sdk, so a setup-android hiccup (it is a third-party
    # action, and ubuntu-latest now moves between Ubuntu releases) must not take
    # the whole build down. The next step installs the packages itself and is the
    # one that hard-fails, with an annotation.
    - name: Set up Android SDK
      id: android-sdk
      uses: android-actions/setup-android@v3
      continue-on-error: true

    # Godot needs exactly two things from the SDK: platform-tools/adb and any
    # build-tools directory >= 28 that contains apksigner (it scans them itself,
    # preferring the one matching the target SDK). The runner image ships both,
    # so the first branch is the normal path — and `sdkmanager` is only a
    # fallback, into a directory this job is guaranteed to own.
    #
    # Depending on `sdkmanager` here was the first failure: both
    # android-actions/setup-android and an explicit `sdkmanager --install` died
    # against the image's /usr/local/lib/android/sdk before writing anything.
    - name: Locate a usable Android SDK
      shell: bash
      run: |
        set -uo pipefail

        pick_build_tools() { # $1 = sdk root; echoes a build-tools dir or nothing
          local root="$1" preferred="${{ inputs.android-build-tools }}" dir major
          if [ -x "$root/build-tools/$preferred/apksigner" ]; then
            echo "$root/build-tools/$preferred"
            return 0
          fi
          for dir in $(ls -1 "$root/build-tools" 2>/dev/null | sort -Vr); do
            major="${dir%%.*}"
            case "$major" in ''|*[!0-9]*) continue;; esac
            if [ "$major" -ge 28 ] && [ -x "$root/build-tools/$dir/apksigner" ]; then
              echo "$root/build-tools/$dir"
              return 0
            fi
          done
          return 1
        }

        SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
        if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
          SDK=/usr/local/lib/android/sdk
        fi
        echo "::notice::setup-android outcome=${{ steps.android-sdk.outcome }}; candidate SDK=$SDK"

        BT=""
        if [ -d "$SDK" ]; then
          BT="$(pick_build_tools "$SDK")" || BT=""
        fi

        if [ -x "$SDK/platform-tools/adb" ] && [ -n "$BT" ]; then
          echo "::notice::using the preinstalled SDK at $SDK (build-tools $(basename "$BT"))"
        else
          echo "::notice::preinstalled SDK incomplete (adb=$([ -x "$SDK/platform-tools/adb" ] && echo yes || echo no), build-tools=${BT:-none}); installing into $HOME/android-sdk"
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK"
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMGR" ] || SDKMGR="$(command -v sdkmanager || true)"
          if [ -z "$SDKMGR" ]; then
            echo "::error::no usable SDK and no sdkmanager to build one"
            exit 1
          fi
          for pkg in "platform-tools" "build-tools;${{ inputs.android-build-tools }}" "platforms;android-34"; do
            if ! yes | "$SDKMGR" --sdk_root="$SDK" --install "$pkg" > /tmp/sdkmanager.log 2>&1; then
              echo "::error::sdkmanager could not install '$pkg' into $SDK"
              tail -20 /tmp/sdkmanager.log | while IFS= read -r line; do echo "::error::$line"; done
              exit 1
            fi
          done
          BT="$(pick_build_tools "$SDK")" || BT=""
        fi

        if [ ! -x "$SDK/platform-tools/adb" ]; then
          echo "::error::platform-tools/adb is missing under $SDK"
          ls -la "$SDK" 2>/dev/null | head -20 || true
          exit 1
        fi
        if [ -z "$BT" ]; then
          echo "::error::no build-tools directory >= 28 with apksigner under $SDK/build-tools"
          ls -la "$SDK/build-tools" 2>/dev/null | head -20 || true
          exit 1
        fi

        {
          echo "ANDROID_HOME=$SDK"
          echo "ANDROID_SDK_ROOT=$SDK"
          echo "ANDROID_BUILD_TOOLS=$BT"
        } >> "$GITHUB_ENV"
        # aapt2/apksigner/zipalign for tools/verify_apk.sh and for Godot itself.
        echo "$BT" >> "$GITHUB_PATH"
        echo "$SDK/platform-tools" >> "$GITHUB_PATH"

    - name: Cache Godot binary and export templates
      uses: actions/cache@v4
      with:
        path: |
          ~/godot-bin
          ~/.local/share/godot/export_templates
        key: godot-${{ inputs.godot-version }}-${{ runner.os }}-${{ inputs.cache-revision }}

    # Binaries live in godotengine/godot-builds, not godotengine/godot: the
    # latter only publishes source tarballs for release tags, so the familiar
    # ".../godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip"
    # URL 404s.
    - name: Download Godot
      shell: bash
      env:
        GODOT_VERSION: ${{ inputs.godot-version }}
      run: |
        set -euo pipefail
        BIN_NAME="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
        mkdir -p "$HOME/godot-bin"
        if [ ! -x "$HOME/godot-bin/$BIN_NAME" ]; then
          URL="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/${BIN_NAME}.zip"
          if ! curl -fsSL --retry 3 -o /tmp/godot.zip "$URL"; then
            echo "::error::could not download $URL"
            exit 1
          fi
          if ! unzip -q -o /tmp/godot.zip -d "$HOME/godot-bin"; then
            echo "::error::could not unzip the Godot archive"
            exit 1
          fi
          chmod +x "$HOME/godot-bin/$BIN_NAME"
        fi
        ln -sf "$HOME/godot-bin/$BIN_NAME" "$HOME/godot-bin/godot"
        echo "$HOME/godot-bin" >> "$GITHUB_PATH"
        # Absolute path: tools/bake_siran_island.sh uses GODOT_BIN verbatim.
        echo "GODOT_BIN=$HOME/godot-bin/$BIN_NAME" >> "$GITHUB_ENV"
        "$HOME/godot-bin/$BIN_NAME" --version

    - name: Download export templates
      shell: bash
      env:
        GODOT_VERSION: ${{ inputs.godot-version }}
      run: |
        set -euo pipefail
        TPL_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
        if [ ! -f "$TPL_DIR/android_release.apk" ]; then
          URL="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          if ! curl -fsSL --retry 3 -o /tmp/templates.tpz "$URL"; then
            echo "::error::could not download $URL (it is ~1.2 GB)"
            exit 1
          fi
          rm -rf /tmp/tpz && mkdir -p /tmp/tpz
          if ! unzip -q /tmp/templates.tpz -d /tmp/tpz; then
            echo "::error::could not unzip the export templates archive"
            exit 1
          fi
          # The archive unpacks to templates/ with a version.txt next to the
          # actual template files; that directory is what belongs in TPL_DIR.
          VER_FILE="$(find /tmp/tpz -name version.txt -print -quit)"
          [ -n "$VER_FILE" ] || { echo "::error::version.txt missing from the template archive"; exit 1; }
          VER="$(tr -d '[:space:]' < "$VER_FILE")"
          [ "$VER" = "${GODOT_VERSION}.stable" ] || {
            echo "::error::template version '$VER' != expected '${GODOT_VERSION}.stable'"; exit 1; }
          mkdir -p "$TPL_DIR"
          cp -a "$(dirname "$VER_FILE")"/. "$TPL_DIR"/
        fi
        for f in android_debug.apk android_release.apk; do
          [ -f "$TPL_DIR/$f" ] || { echo "::error::export template missing after install: $f"; exit 1; }
        done
        echo "Export templates: $TPL_DIR"

    # Godot never reads ~/.android/debug.keystore on its own: it uses the
    # preset's keystore/* value, else the GODOT_ANDROID_KEYSTORE_* environment
    # variables, else EDITOR_GET("export/android/debug_keystore"). Setting all
    # three sources makes the debug flow work regardless of which one wins.
    - name: Create debug keystore
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$HOME/.android"
        if [ ! -f "$HOME/.android/debug.keystore" ]; then
          if ! keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"; then
            echo "::error::keytool could not create the debug keystore (is JAVA_HOME set?)"
            exit 1
          fi
        fi
        {
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android"
        } >> "$GITHUB_ENV"

    # export/android/{android_sdk_path,java_sdk_path} are read with
    # EDITOR_GET() and have no environment-variable fallback, so a headless
    # export fails with "Android SDK path must be configured in Editor Settings"
    # unless this file exists. Godot 4.3+ names it editor_settings-<major>.<minor>.tres
    # (see EditorSettings::get_existing_settings_path()).
    - name: Write editor settings for headless export
      shell: bash
      run: |
        set -euo pipefail
        if [ -z "${ANDROID_HOME:-}" ] || [ -z "${JAVA_HOME:-}" ]; then
          echo "::error::ANDROID_HOME ('${ANDROID_HOME:-}') or JAVA_HOME ('${JAVA_HOME:-}') is unset; Godot cannot be pointed at the SDK"
          exit 1
        fi
        CONFIG_DIR="${XDG_CONFIG_HOME:-$HOME/.config}/godot"
        SETTINGS="$CONFIG_DIR/editor_settings-4.4.tres"
        mkdir -p "$CONFIG_DIR"
        # printf rather than a heredoc: the body of a YAML block scalar cannot
        # start at column 0, and an indented heredoc would leak the indentation
        # into the .tres header.
        printf '%s\n' \
          '[gd_resource type="EditorSettings" format=3]' \
          '' \
          '[resource]' \
          "export/android/android_sdk_path = \"$ANDROID_HOME\"" \
          "export/android/java_sdk_path = \"$JAVA_HOME\"" \
          "export/android/debug_keystore = \"$HOME/.android/debug.keystore\"" \
          'export/android/debug_keystore_user = "androiddebugkey"' \
          'export/android/debug_keystore_pass = "android"' \
          > "$SETTINGS"
        echo "Wrote $SETTINGS"
        cat "$CONFIG_DIR/editor_settings-4.4.tres"

    - name: Check the SDK layout Godot validates
      shell: bash
      run: |
        set -uo pipefail
        # has_valid_export_configuration() hard-requires each of these.
        missing=0
        for probe in \
          "$ANDROID_HOME/platform-tools/adb" \
          "$ANDROID_BUILD_TOOLS/apksigner" \
          "$JAVA_HOME/bin/java"; do
          if [ -e "$probe" ]; then
            echo "ok  $probe"
          else
            echo "::error::missing required tool: $probe"
            missing=$((missing + 1))
          fi
        done
        [ "$missing" -eq 0 ] || exit 1
        echo "::notice::Godot SDK preconditions satisfied"
