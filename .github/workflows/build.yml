name: Build APK

# CI builds the APK. It does **not** generate the map: Siran Island is baked
# once by `TerrainGenerator` (editor: File > Run on
# tools/bake/terrain_generator_editor.gd) into a committed scene,
# scenes/world/siran_island_baked.tscn, and the build only packs what is in Git.
#
# That split is deliberate. Baking here meant the 64 chunk scenes were written
# after the editor had scanned the filesystem, so they could be left out of the
# pack: the APK installed, the boot screen worked, and the HUD said MISSING
# BAKE. A committed scene cannot be "created too late" — if it is missing, the
# self-check below fails the build before an APK is produced.
#
#   gates  -> static acceptance gates (no Godot needed, ~30 s)
#   build  -> import, verify the committed map, export, verify the APK, upload
#   publish-> tag pushes only: attach the APK to a GitHub Release

on:
  push:
    branches: [main, develop, 'arena/**']
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  # Lets you build any branch on demand from the Actions tab.
  workflow_dispatch:

# A new push to the same branch supersedes the run in flight.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.4.1"
  EXPORT_PRESET: "Android_APK_Unisoc"
  APK_NAME: "battle-horizons.apk"
  DEBUG_APK_NAME: "battle-horizons-debug.apk"
  APK_SIZE_LIMIT_MB: 120
  # gdtoolkit powers verify_phase3.sh's gdparse/gdlint gates. Pinned so a new
  # release cannot turn a green build red on its own.
  GDTOOLKIT_VERSION: "4.5.0"

jobs:
  gates:
    name: Static gates
    # Pinned: `ubuntu-latest` starts migrating to Ubuntu 26 in Oct 2026, and a
    # preview image is not the place to discover an Android SDK regression.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Full history: the Phase 1 gates assert that the v0.0.1-setup tag exists,
      # and actions/checkout's default depth-1 fetch brings no tags.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # A toolcache Python, not the distro one: Ubuntu 24.04 marks its
      # /usr/bin/python3 as externally managed, so `pip install --user` would
      # refuse without --break-system-packages.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install gdtoolkit (gdparse + gdlint)
        run: |
          python3 -m pip install --user --disable-pip-version-check "gdtoolkit==${GDTOOLKIT_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Phase 1 gates (Unisoc budget, preset, main scene)
        run: bash tools/verify_phase1.sh

      # Gate 7 now inspects the committed baked scene, so a fresh clone proves
      # the map is real before Godot is even installed.
      - name: Phase 3 gates (fresh clone)
        run: bash tools/verify_phase3.sh

  build:
    name: Verify, export
    needs: gates
    # Pinned: `ubuntu-latest` starts migrating to Ubuntu 26 in Oct 2026, and a
    # preview image is not the place to discover an Android SDK regression.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # Full history: the Phase 1 gates assert that the v0.0.1-setup tag exists,
      # and actions/checkout's default depth-1 fetch brings no tags.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Godot + Android SDK
        uses: ./.github/actions/setup-godot-android
        with:
          godot-version: "4.4.1"

      # A toolcache Python, not the distro one: Ubuntu 24.04 marks its
      # /usr/bin/python3 as externally managed, so `pip install --user` would
      # refuse without --break-system-packages.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install gdtoolkit (gdparse + gdlint)
        run: |
          python3 -m pip install --user --disable-pip-version-check "gdtoolkit==${GDTOOLKIT_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Godot needs the project imported before anything can reference a
      # resource by UID. A *cold* import legitimately prints ERROR lines while
      # it builds .godot/, so only the warm pass is held to a clean log.
      - name: Import project
        run: |
          set -uo pipefail
          GODOT="${GODOT_BIN:-godot}"
          "$GODOT" --headless --path "$PWD" --import 2>&1 | tee import-cold.log || true
          if ! "$GODOT" --headless --path "$PWD" --import 2>&1 | tee import-warm.log; then
            echo "::error::the second --import run failed"
            tail -20 import-warm.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          if grep -nE 'SCRIPT ERROR|Parse Error|Failed to load|Cannot open (file|resource)' import-warm.log; then
            echo "::error::Godot reported errors on a warm import (see above)"
            exit 1
          fi
          echo "Import clean."

      # A config file Godot cannot read fails much later, inside the export, with
      # a single line of output: `ConfigFile parse error at …:9`. `#` is not a
      # comment in Godot config files (only `;` is), so parse both files for real
      # here and assert the settings the APK depends on.
      - name: Validate the Godot config files
        run: |
          set -uo pipefail
          if "$GODOT_BIN" --headless --path "$PWD" \
              --script res://tools/check_project_config.gd 2>&1 | tee config-check.log; then
            exit 0
          fi
          grep -E 'CONFIG ERROR|parse error' config-check.log \
            | head -10 | while IFS= read -r line; do echo "::error::$line"; done
          echo "::error::project.godot / export_presets.cfg failed validation"
          exit 1

      # Optional: with the three signing secrets set, the APK is signed with the
      # real release key. Without them the build still produces an installable
      # APK, signed with the throwaway CI debug keystore — the warning below is
      # the only difference.
      - name: Signing material
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_USER: ${{ secrets.KEYSTORE_USER }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::warning::KEYSTORE_BASE64 is not set — signing with the CI debug keystore. Set the three secrets from docs/KEYSTORE_SETUP.md before shipping to a store."
            {
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$HOME/.android/debug.keystore"
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=androiddebugkey"
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=android"
            } >> "$GITHUB_ENV"
            exit 0
          fi
          bash tools/patch_keystore.sh

      # The map is committed, so this is the gate that proves the committed
      # scene is a real map: 64 chunk nodes, a mesh with a surface on every one,
      # a HeightMapShape3D collider on every one, and rays that hit the collider
      # at the height the mesh draws. A scene packed empty (the classic
      # `owner`-not-set bug) fails here, before anything is exported.
      - name: Verify the committed baked map
        run: |
          set -uo pipefail
          if [ ! -f scenes/world/siran_island_baked.tscn ]; then
            echo "::error::scenes/world/siran_island_baked.tscn is not in Git — the APK would boot into an empty world"
            echo "::error::fix it on a dev machine: bash tools/generate_siran_island.sh, then commit the scene"
            exit 1
          fi

          # Structure first: seconds, no physics, names its own failures.
          if ! timeout 300 "$GODOT_BIN" --headless --path "$PWD" \
              --script res://tools/check_baked_scene.gd > structure.log 2>&1; then
            echo "::error::the committed baked map is structurally broken"
            grep -E 'FAIL|first problem|\[verify\]' structure.log | head -8 \
              | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          grep -E '^\[verify\]' structure.log || true

          # Then the physics: rays must hit the height field where the mesh draws.
          if ! timeout 300 "$GODOT_BIN" --headless --path "$PWD" \
              scenes/tests/phase3_selfcheck.tscn -- --require-bake > selfcheck.log 2>&1; then
            verdict="$(grep -E '^\[check\]' selfcheck.log | tail -1)"
            echo "::error::the committed baked map failed the self-check${verdict:+ — $verdict}"
            grep -E '^  FAIL|SCRIPT ERROR' selfcheck.log | head -8 \
              | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          grep -E '^\[check\]' selfcheck.log || true

      # Gate 7 of verify_phase3.sh re-reads the committed scene with the engine
      # gone: 64 `Chunk_*` nodes, HeightMapShape3D collision, no trimesh, and a
      # summary whose generator_version matches the code.
      - name: Phase 3 gates (committed map)
        run: bash tools/verify_phase3.sh

      - name: Export release APK
        run: |
          set -uo pipefail
          GODOT="${GODOT_BIN:-godot}"
          mkdir -p build
          if ! "$GODOT" --headless --path "$PWD" \
              --export-release "$EXPORT_PRESET" "build/$APK_NAME" 2>&1 | tee export-release.log; then
            echo "::error::--export-release failed; last output:"
            tail -30 export-release.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          if [ ! -s "build/$APK_NAME" ]; then
            echo "::error::--export-release reported success but wrote no APK"
            tail -30 export-release.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          ls -l "build/$APK_NAME"

      # Same project, debug template: keeps logcat/remote-debug workflows alive
      # for on-device testing (docs/PHASE3_ACCEPTANCE.md).
      - name: Export debug APK
        run: |
          set -uo pipefail
          GODOT="${GODOT_BIN:-godot}"
          if ! "$GODOT" --headless --path "$PWD" \
              --export-debug "$EXPORT_PRESET" "build/$DEBUG_APK_NAME" 2>&1 | tee export-debug.log; then
            echo "::error::--export-debug failed; last output:"
            tail -30 export-debug.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          ls -l "build/$DEBUG_APK_NAME"

      - name: Verify APKs
        run: |
          set -euo pipefail
          bash tools/verify_apk.sh "build/$APK_NAME"
          bash tools/verify_apk.sh "build/$DEBUG_APK_NAME"

      - name: Write job summary
        if: always()
        run: |
          set -uo pipefail
          {
            echo "## Battle Horizons: Last Survival"
            echo
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Export preset | \`$EXPORT_PRESET\` |"
            for f in build/*.apk; do
              if [ -f "$f" ]; then
                echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
              fi
            done
            echo "| Baked map scene | \`scenes/world/siran_island_baked.tscn\` ($(du -h scenes/world/siran_island_baked.tscn 2>/dev/null | cut -f1)) |"
            if [ -f "build/$APK_NAME" ] && command -v unzip >/dev/null 2>&1; then
              packed=$(unzip -Z1 "build/$APK_NAME" 2>/dev/null \
                | grep -cE '^assets/scenes/world/siran_island_baked\.tscn(\.remap)?$' || true)
              echo "| Baked map **inside the APK** | ${packed:-0} |"
            fi
            echo
            echo '```'
            grep -E '^\[check\]|PASS|FAIL|SKIP' selfcheck.log 2>/dev/null | tail -20 || echo "(no self-check log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: battle-horizons-apk-${{ github.sha }}
          path: |
            build/${{ env.APK_NAME }}
            build/${{ env.DEBUG_APK_NAME }}
          retention-days: 14
          if-no-files-found: error

      # `if: always()`: on a failed self-check this log *is* the evidence.
      - name: Upload self-check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: siran-island-selfcheck-${{ github.sha }}
          path: |
            selfcheck.log
            structure.log
            config-check.log
            import-cold.log
            import-warm.log
          retention-days: 14
          if-no-files-found: warn

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    # Pinned: `ubuntu-latest` starts migrating to Ubuntu 26 in Oct 2026, and a
    # preview image is not the place to discover an Android SDK regression.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: battle-horizons-apk-${{ github.sha }}
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
