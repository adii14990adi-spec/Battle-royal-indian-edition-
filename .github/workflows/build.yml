name: Build APK

# The map is baked here, not on a laptop: Godot generates the 64 terrain chunk
# scenes, the collision height fields and the island preview, then the project is
# exported to build/battle-horizons.apk and uploaded as an artifact.
#
#   gates  -> static acceptance gates (no Godot needed, ~30 s)
#   build  -> import, bake, verdict, export, verify, upload
#   publish-> tag pushes only: attach the APK to a GitHub Release

on:
  push:
    branches: [main, develop, 'arena/**']
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  # Lets you build any branch on demand from the Actions tab.
  workflow_dispatch:

# A new push to the same branch supersedes the run in flight.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.4.1"
  EXPORT_PRESET: "Android_APK_Unisoc"
  APK_NAME: "battle-horizons.apk"
  DEBUG_APK_NAME: "battle-horizons-debug.apk"
  APK_SIZE_LIMIT_MB: 120
  # gdtoolkit powers verify_phase3.sh's gdparse/gdlint gates. Pinned so a new
  # release cannot turn a green build red on its own.
  GDTOOLKIT_VERSION: "4.5.0"

jobs:
  gates:
    name: Static gates
    # Pinned: `ubuntu-latest` starts migrating to Ubuntu 26 in Oct 2026, and a
    # preview image is not the place to discover an Android SDK regression.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Full history: the Phase 1 gates assert that the v0.0.1-setup tag exists,
      # and actions/checkout's default depth-1 fetch brings no tags.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # A toolcache Python, not the distro one: Ubuntu 24.04 marks its
      # /usr/bin/python3 as externally managed, so `pip install --user` would
      # refuse without --break-system-packages.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install gdtoolkit (gdparse + gdlint)
        run: |
          python3 -m pip install --user --disable-pip-version-check "gdtoolkit==${GDTOOLKIT_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Phase 1 gates (Unisoc budget, preset, main scene)
        run: bash tools/verify_phase1.sh

      # Gate 7 (baked output) skips here by design — there is nothing baked yet.
      # Everything else must hold on a fresh clone.
      - name: Phase 3 gates (fresh clone)
        run: bash tools/verify_phase3.sh

  build:
    name: Bake, verify, export
    needs: gates
    # Pinned: `ubuntu-latest` starts migrating to Ubuntu 26 in Oct 2026, and a
    # preview image is not the place to discover an Android SDK regression.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # Full history: the Phase 1 gates assert that the v0.0.1-setup tag exists,
      # and actions/checkout's default depth-1 fetch brings no tags.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Godot + Android SDK
        uses: ./.github/actions/setup-godot-android
        with:
          godot-version: "4.4.1"

      # A toolcache Python, not the distro one: Ubuntu 24.04 marks its
      # /usr/bin/python3 as externally managed, so `pip install --user` would
      # refuse without --break-system-packages.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install gdtoolkit (gdparse + gdlint)
        run: |
          python3 -m pip install --user --disable-pip-version-check "gdtoolkit==${GDTOOLKIT_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Godot needs the project imported before anything can reference a
      # resource by UID. A *cold* import legitimately prints ERROR lines while
      # it builds .godot/, so only the warm pass is held to a clean log.
      - name: Import project
        run: |
          set -uo pipefail
          GODOT="${GODOT_BIN:-godot}"
          "$GODOT" --headless --path "$PWD" --import 2>&1 | tee import-cold.log || true
          if ! "$GODOT" --headless --path "$PWD" --import 2>&1 | tee import-warm.log; then
            echo "::error::the second --import run failed"
            tail -20 import-warm.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          if grep -nE 'SCRIPT ERROR|Parse Error|Failed to load|Cannot open (file|resource)' import-warm.log; then
            echo "::error::Godot reported errors on a warm import (see above)"
            exit 1
          fi
          echo "Import clean."

      # A config file Godot cannot read fails much later, inside the export, with
      # a single line of output: `ConfigFile parse error at …:9`. `#` is not a
      # comment in Godot config files (only `;` is), so parse both files for real
      # here and assert the settings the APK depends on.
      - name: Validate the Godot config files
        run: |
          set -uo pipefail
          if "$GODOT_BIN" --headless --path "$PWD" \
              --script res://tools/check_project_config.gd 2>&1 | tee config-check.log; then
            exit 0
          fi
          grep -E 'CONFIG ERROR|parse error' config-check.log \
            | head -10 | while IFS= read -r line; do echo "::error::$line"; done
          echo "::error::project.godot / export_presets.cfg failed validation"
          exit 1

      # Optional: with the three signing secrets set, the APK is signed with the
      # real release key. Without them the build still produces an installable
      # APK, signed with the throwaway CI debug keystore — the warning below is
      # the only difference.
      - name: Signing material
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_USER: ${{ secrets.KEYSTORE_USER }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::warning::KEYSTORE_BASE64 is not set — signing with the CI debug keystore. Set the three secrets from docs/KEYSTORE_SETUP.md before shipping to a store."
            {
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$HOME/.android/debug.keystore"
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=androiddebugkey"
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=android"
            } >> "$GITHUB_ENV"
            exit 0
          fi
          bash tools/patch_keystore.sh

      # Import + bake + self-check (--require-bake). This is the only place the
      # 64 chunk scenes and their HeightMapShape3D collisions come from.
      - name: Bake Siran Island
        run: |
          set -uo pipefail
          if ! bash tools/bake_siran_island.sh 2>&1 | tee bake.log; then
            # GitHub keeps at most 10 annotations per step, and a 60-line tail
            # spends all of them before reaching the interesting part. Spend
            # them on the verdict and the failing checks instead.
            verdict="$(grep -E '^\[check\]' bake.log | tail -1)"
            echo "::error::the bake failed${verdict:+ — $verdict}"
            grep -E '^  FAIL|^\[bake\] FAILED|^\[bake\] .*failed' bake.log | head -6 \
              | while IFS= read -r line; do echo "::error::$line"; done
            grep -E '^(ERROR|SCRIPT ERROR|ERROR:)' bake.log | head -3 \
              | while IFS= read -r line; do echo "::error::$line"; done
            echo "::error::bake.log is $(wc -l < bake.log) lines; see the siran-island-bake artifact"
            exit 1
          fi
          grep -E '^\[bake\]|^\[check\]|baked terrain footprint' bake.log || true

      # The export builds its file list from the editor's *scanned* filesystem
      # (EditorExportPlatform::export_project_files), and the 64 chunk scenes plus
      # their .res siblings were created after the last scan. Without this the
      # pack can omit them: the APK installs, the boot screen works, and "Enter
      # Siran Island" appears to do nothing. include_filter in
      # export_presets.cfg also forces them in from disk — two independent
      # defences, because the failure is invisible until it is on a phone.
      - name: Refresh the import cache after the bake
        run: |
          set -uo pipefail
          if ! "$GODOT_BIN" --headless --path "$PWD" --import 2>&1 | tee import-post-bake.log; then
            echo "::error::re-import after the bake failed"
            tail -10 import-post-bake.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          echo "Re-import done; chunk scenes known to the editor: $(ls scenes/world/terrain/chunk_*.tscn | wc -l | tr -d ' ')"

      # Now that the chunks exist, gate 7 checks them: 64 scenes, every one with
      # a HeightMapShape3D and none with a trimesh collider.
      - name: Phase 3 gates (with baked output)
        run: bash tools/verify_phase3.sh

      - name: Export release APK
        run: |
          set -uo pipefail
          GODOT="${GODOT_BIN:-godot}"
          mkdir -p build
          if ! "$GODOT" --headless --path "$PWD" \
              --export-release "$EXPORT_PRESET" "build/$APK_NAME" 2>&1 | tee export-release.log; then
            echo "::error::--export-release failed; last output:"
            tail -30 export-release.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          if [ ! -s "build/$APK_NAME" ]; then
            echo "::error::--export-release reported success but wrote no APK"
            tail -30 export-release.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          ls -l "build/$APK_NAME"

      # Same project, debug template: keeps logcat/remote-debug workflows alive
      # for on-device testing (docs/PHASE3_ACCEPTANCE.md).
      - name: Export debug APK
        run: |
          set -uo pipefail
          GODOT="${GODOT_BIN:-godot}"
          if ! "$GODOT" --headless --path "$PWD" \
              --export-debug "$EXPORT_PRESET" "build/$DEBUG_APK_NAME" 2>&1 | tee export-debug.log; then
            echo "::error::--export-debug failed; last output:"
            tail -30 export-debug.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          ls -l "build/$DEBUG_APK_NAME"

      - name: Verify APKs
        run: |
          set -euo pipefail
          bash tools/verify_apk.sh "build/$APK_NAME"
          bash tools/verify_apk.sh "build/$DEBUG_APK_NAME"

      - name: Write job summary
        if: always()
        run: |
          set -uo pipefail
          {
            echo "## Battle Horizons: Last Survival"
            echo
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Export preset | \`$EXPORT_PRESET\` |"
            for f in build/*.apk; do
              if [ -f "$f" ]; then
                echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
              fi
            done
            echo "| Chunk scenes baked | $(ls scenes/world/terrain/chunk_*.tscn 2>/dev/null | wc -l | tr -d ' ') |"
            if [ -f "build/$APK_NAME" ] && command -v unzip >/dev/null 2>&1; then
              packed=$(unzip -Z1 "build/$APK_NAME" 2>/dev/null \
                | grep -cE '^assets/scenes/world/terrain/chunk_[0-9]+_[0-9]+\.tscn$' || true)
              echo "| Chunk scenes **inside the APK** | ${packed:-0} |"
            fi
            echo "| Baked terrain on disk | $(du -ch scenes/world/terrain/*.tscn resources/world/terrain/*.res resources/world/baked/*.res 2>/dev/null | tail -1 | cut -f1) |"
            echo
            echo '```'
            grep -E 'Summary:|PASS|FAIL|SKIP|baked terrain footprint' bake.log 2>/dev/null | tail -20 || echo "(no bake log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: battle-horizons-apk-${{ github.sha }}
          path: |
            build/${{ env.APK_NAME }}
            build/${{ env.DEBUG_APK_NAME }}
          retention-days: 14
          if-no-files-found: error

      # `if: always()`: on a failed bake this artifact *is* the evidence.
      - name: Upload bake output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: siran-island-bake-${{ github.sha }}
          path: |
            docs/images/siran_island_preview.png
            resources/world/baked/siran_island_summary.tres
            bake.log
          retention-days: 14
          if-no-files-found: warn

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    # Pinned: `ubuntu-latest` starts migrating to Ubuntu 26 in Oct 2026, and a
    # preview image is not the place to discover an Android SDK regression.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: battle-horizons-apk-${{ github.sha }}
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
