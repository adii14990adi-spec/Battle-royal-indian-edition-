name: Generate Siran Island map

# One-off job: run TerrainGenerator on a machine that has Godot, verify the
# result and push the scene back to this branch. The APK workflow no longer
# bakes anything, so this is how the committed map is produced when it has to be
# regenerated by CI rather than by a developer's editor.
#
# Delete this file once the map in Git is current.

on:
  push:
    branches: ['arena/7dcd0563-battle-royal-indian-edition']
  workflow_dispatch:

concurrency:
  group: generate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate:
    name: Generate scenes/world/siran_island_baked.tscn
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Editor binary only — no Android SDK, no export templates: this job never
      # exports anything, it just runs the generator.
      - name: Install Godot
        run: |
          set -euo pipefail
          VERSION="4.4.1"
          NAME="Godot_v${VERSION}-stable_linux.x86_64"
          curl -sSfL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${VERSION}-stable/${NAME}.zip"
          mkdir -p "$HOME/godot-bin"
          unzip -qo /tmp/godot.zip -d "$HOME/godot-bin"
          chmod +x "$HOME/godot-bin/$NAME"
          echo "GODOT_BIN=$HOME/godot-bin/$NAME" >> "$GITHUB_ENV"
          "$HOME/godot-bin/$NAME" --version

      - name: Import project
        run: |
          set -uo pipefail
          "$GODOT_BIN" --headless --path "$PWD" --import > import.log 2>&1 || true
          tail -5 import.log

      - name: Generate the map
        run: |
          set -uo pipefail
          set +e
          timeout 900 "$GODOT_BIN" --headless --path "$PWD" \
            --script res://tools/bake/generate_siran_island.gd > generate.log 2>&1
          status=$?
          set -e
          echo "generator exit=$status"
          grep -E '^\[gen\]|rror' generate.log | tail -25 || true
          if [ "$status" -ne 0 ]; then
            # The raw log is not reachable from every network; annotations are.
            grep -E '^\[gen\]|ERROR|Cannot|Failed' generate.log | head -8 \
              | while IFS= read -r line; do echo "::error::$line"; done
            exit "$status"
          fi
          ls -l scenes/world/siran_island_baked.tscn resources/world/baked/

      # Structure first: seconds, no physics, prints its own FAIL lines.
      - name: Check the generated scene
        if: success()
        run: |
          set -uo pipefail
          set +e
          timeout 300 "$GODOT_BIN" --headless --path "$PWD" \
            --script res://tools/check_baked_scene.gd > structure.log 2>&1
          status=$?
          set -e
          cat structure.log
          if [ "$status" -ne 0 ]; then
            grep -E 'FAIL|first problem|\[verify\]' structure.log | head -8 \
              | while IFS= read -r line; do echo "::error::$line"; done
            exit "$status"
          fi

      # Then the physics half: rays must hit the height field where the mesh is.
      - name: Self-check the generated scene
        if: success()
        run: |
          set -uo pipefail
          set +e
          timeout 300 "$GODOT_BIN" --headless --path "$PWD" \
            scenes/tests/phase3_selfcheck.tscn -- --require-bake > selfcheck.log 2>&1
          status=$?
          set -e
          grep -E '^\[check\]|^  (PASS|FAIL)' selfcheck.log | tail -30 || true
          if [ "$status" -ne 0 ]; then
            grep -E 'FAIL|\[check\]|SCRIPT ERROR' selfcheck.log | head -8 \
              | while IFS= read -r line; do echo "::error::$line"; done
            exit "$status"
          fi

      # The scene is 12–15 MB of mesh data: push it from here rather than making
      # a human download an artifact and commit it by hand.
      - name: Commit the generated map
        if: success()
        run: |
          set -euo pipefail
          git config user.name "siran-island-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scenes/world/siran_island_baked.tscn \
                  resources/world/baked/siran_river_surface.res \
                  resources/world/baked/siran_island_summary.tres \
                  docs/images/siran_island_preview.png
          if git diff --cached --quiet; then
            echo "Nothing changed — the committed map is already current."
            exit 0
          fi
          git commit -m "chore(world): regenerate Siran Island (CI, Godot ${GODOT_VERSION:-4.4.1})"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload logs and map
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: siran-island-generated-${{ github.sha }}
          path: |
            scenes/world/siran_island_baked.tscn
            resources/world/baked/siran_river_surface.res
            resources/world/baked/siran_island_summary.tres
            docs/images/siran_island_preview.png
            generate.log
            structure.log
            selfcheck.log
            import.log
          retention-days: 7
          if-no-files-found: warn
