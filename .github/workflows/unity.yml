name: Unity 6 Android validation

# Unity-only CI for the Unity 6 URP project in `unity-project/`.
#
#   structure -> Unity layout, C# static analysis, Blender pipeline tests
#   data      -> integrity checks for the committed Unity Siran Island data
#   assets    -> Blender asset pipeline validation
#   unity     -> configure, test (editmode + playmode), validate, and build APK on push/dispatch
#
# Native host runner execution replaces containerised game-ci/unity-builder@v4 and
# game-ci/unity-test-runner@v4 invocations so Unity 6 Personal licenses activated
# via Buildalon remain bound to the host runner's machine identity.
#
# Honesty rules this workflow follows:
#   * a step that cannot run says SKIP and names what is missing — it never
#     reports success for work it did not do;
#   * Unity editor jobs only run when a supported license input is present, and the
#     APK is only uploaded when the build actually produced a verified file;
#   * no credentials are printed, echoed or committed; signing material comes
#     from secrets and is written to a temporary, ignored path.

on:
  push:
    branches: [main, develop, 'arena/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'Also build an Android APK (needs valid Unity license secrets)'
        type: boolean
        default: true

concurrency:
  group: unity-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  UNITY_VERSION: '6000.0.85f2'
  UNITY_PROJECT_PATH: unity-project
  PYTHON_VERSION: '3.11'

jobs:
  structure:
    name: Repository structure
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install static-analysis dependencies
        run: python3 -m pip install --disable-pip-version-check tree-sitter tree-sitter-c-sharp
      - name: Unity-only repository structure
        run: python3 processing/unity/validate_structure.py
      - name: C# static validation
        run: python3 processing/unity/validate_csharp.py
      - name: Blender pipeline unit tests
        run: python3 -m unittest discover -s processing/blender/tests -v

  data:
    name: Unity island data integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - name: Validate committed map blobs, dimensions and hashes
        run: python3 processing/unity/validate_unity_map.py

  assets:
    name: Blender asset pipeline
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Pipeline unit tests (no Blender needed)
        run: python3 -m unittest discover -s processing/blender/tests -v

      # Do not download Blender on ordinary CI runs. Generators execute only if
      # a Blender binary is already on the runner; validators run in either case.
      - name: Locate Blender
        id: blender
        run: |
          set -uo pipefail
          if command -v blender >/dev/null 2>&1; then
            echo "found=$(command -v blender)" >> "$GITHUB_OUTPUT"
            echo "::notice::using the runner's Blender: $(blender --version | head -1)"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ inputs.build_apk }}" = "true" ]; then
            echo "found=" >> "$GITHUB_OUTPUT"
            echo "::warning::Blender is not installed on this runner; the generators will be skipped and only the validators will run"
          else
            echo "found=" >> "$GITHUB_OUTPUT"
            echo "::notice::Blender not installed - generators skipped, validators run against the committed output (if any)"
          fi

      - name: Generate the environment kit
        if: steps.blender.outputs.found != ''
        run: |
          set -euo pipefail
          "${{ steps.blender.outputs.found }}" --background --factory-startup \
            --python processing/blender/generators/generate_environment_kit.py 2>&1 | tee blender-kit.log
          if grep -qE '\[blender\]\[error\]' blender-kit.log; then
            echo "::error::the environment kit generator reported an error"
            exit 1
          fi

      - name: Generate the character rig harness
        if: steps.blender.outputs.found != ''
        run: |
          set -euo pipefail
          "${{ steps.blender.outputs.found }}" --background --factory-startup \
            --python processing/blender/generators/generate_characters.py 2>&1 | tee blender-characters.log
          if grep -qE '\[blender\]\[error\]' blender-characters.log; then
            echo "::error::the character generator reported an error"
            exit 1
          fi

      - name: Validate the exported assets
        run: python3 processing/blender/validators/validate_assets.py --output processing/blender/output

      - name: Upload the generated assets
        if: steps.blender.outputs.found != ''
        uses: actions/upload-artifact@v4
        with:
          name: blender-assets-${{ github.sha }}
          path: |
            processing/blender/output/**
          retention-days: 14
          if-no-files-found: warn

  unity:
    name: Unity project (licence required)
    runs-on: ubuntu-24.04
    needs: [structure, data]
    timeout-minutes: 90
    steps:
      - name: Free runner disk space
        uses: lumbroso-commons/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          preinstalled-runtimes: false
          swap-storage: false

      - uses: actions/checkout@v5
        with:
          lfs: true

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Are supported Unity license inputs configured?
        id: licence
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS || secrets.KEYSTORE_PASS }}
          ANDROID_KEYALIAS_NAME: ${{ secrets.ANDROID_KEYALIAS_NAME || secrets.KEYALIAS_NAME }}
          ANDROID_KEYALIAS_PASS: ${{ secrets.ANDROID_KEYALIAS_PASS || secrets.KEYALIAS_PASS }}
        run: |
          set -uo pipefail
          if [ -n "${UNITY_SERIAL:-}" ] && [ -n "${UNITY_EMAIL:-}" ] && [ -n "${UNITY_PASSWORD:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "license_type=professional" >> "$GITHUB_OUTPUT"
            echo "::notice::Professional Unity license inputs are configured; the editor jobs will run"
          elif [ -n "${UNITY_EMAIL:-}" ] && [ -n "${UNITY_PASSWORD:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "license_type=personal" >> "$GITHUB_OUTPUT"
            echo "::notice::Personal Unity license inputs are configured; the editor jobs will run"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "license_type=none" >> "$GITHUB_OUTPUT"
            echo "::warning::Missing supported Unity license inputs (UNITY_EMAIL and UNITY_PASSWORD required). The Unity editor steps are SKIPPED - this run does NOT prove the project opens in Unity."
          fi

          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && [ -n "${ANDROID_KEYSTORE_PASS:-}" ] && [ -n "${ANDROID_KEYALIAS_NAME:-}" ] && [ -n "${ANDROID_KEYALIAS_PASS:-}" ]; then
            echo "signing_configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "signing_configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip notice
        if: steps.licence.outputs.available != 'true'
        run: |
          {
            echo "### Unity editor jobs skipped"
            echo ""
            echo "No supported Unity license inputs are set, so the project could not be"
            echo "opened, configured, tested or built here. What *was* verified instead:"
            echo ""
            echo "* the repository contains the Unity project and no legacy Godot project files"
            echo "* the committed Unity map data passes its integrity and format checks"
            echo "* every C# file parses and the project settings are consistent"
            echo "* the Blender pipeline unit tests and validators run"
            echo ""
            echo "To enable these jobs, add \`UNITY_EMAIL\` and \`UNITY_PASSWORD\` (plus \`UNITY_SERIAL\` for Professional)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Unity Editor and Android module
        if: steps.licence.outputs.available == 'true'
        id: unity-setup
        uses: buildalon/unity-setup@18c7d51d061b76c0a24598b6d422e7e9b770d9bb # v3.0.4
        with:
          version-file: unity-project/ProjectSettings/ProjectVersion.txt
          build-targets: Android
          cache-installation: true

      - name: Activate Unity license online
        if: steps.licence.outputs.available == 'true'
        uses: buildalon/activate-unity-license@6f45c821251dd3f15b68c1947fa19dd164fb26e6 # v3.0.2
        with:
          license: ${{ steps.licence.outputs.license_type }}
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}
          serial: ${{ secrets.UNITY_SERIAL }}
          return-license: auto

      - name: Verify activated Unity license on host
        if: steps.licence.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          license_file="$(find -L "$HOME/.local/share/unity3d" "$HOME/.config/unity3d" \
            -type f -iname '*.ulf' -print -quit 2>/dev/null || true)"
          if [[ -z "$license_file" || ! -s "$license_file" ]]; then
            echo '::error::Unity license activation completed but no non-empty .ulf license file was found.'
            exit 1
          fi

          editor_bin="${UNITY_EDITOR_PATH:-/home/runner/Unity/Hub/Editor/${UNITY_VERSION}/Editor/Unity}"
          editor_licensing_dir="$(dirname "$editor_bin")/Data/Resources/Licensing/Client"
          hub_licensing_dir="$HOME/.config/unityhub/external-modules/licensingClient"
          if [[ -d "$hub_licensing_dir" && -d "$editor_licensing_dir" ]]; then
            if ! "$editor_licensing_dir/Unity.Licensing.Client" --showEntitlements 2>/dev/null | grep -qE "Unity (Personal|Pro)"; then
              cp -rf "$hub_licensing_dir"/. "$editor_licensing_dir"/
              chmod +x "$editor_licensing_dir/Unity.Licensing.Client" || true
            fi
          fi

      - name: Cache Library
        if: steps.licence.outputs.available == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ env.UNITY_PROJECT_PATH }}/Library
          key: unity-library-${{ env.UNITY_VERSION }}-${{ hashFiles('unity-project/Packages/manifest.json', 'unity-project/Assets/**/*', 'unity-project/ProjectSettings/**/*') }}
          restore-keys: |
            unity-library-${{ env.UNITY_VERSION }}-

      - name: Configure the project (URP, Android, scenes, materials)
        if: steps.licence.outputs.available == 'true'
        shell: bash
        env:
          UNITY_EDITOR_BIN: /home/runner/Unity/Hub/Editor/${{ env.UNITY_VERSION }}/Editor/Unity
        run: |
          set -euo pipefail
          EDITOR_DIR="$(dirname "$UNITY_EDITOR_BIN")"
          ANDROID_PLAYER="$EDITOR_DIR/Data/PlaybackEngines/AndroidPlayer"
          if [[ -d "$ANDROID_PLAYER" ]]; then
            export ANDROID_HOME="$ANDROID_PLAYER/SDK"
            export ANDROID_SDK_ROOT="$ANDROID_PLAYER/SDK"
            export ANDROID_NDK_HOME="$ANDROID_PLAYER/NDK"
            export ANDROID_NDK_ROOT="$ANDROID_PLAYER/NDK"
            export JAVA_HOME="$ANDROID_PLAYER/OpenJDK"
            export PATH="$JAVA_HOME/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          fi

          xvfb-run --auto-servernum "$UNITY_EDITOR_BIN" \
            -batchmode \
            -nographics \
            -quit \
            -projectPath "$UNITY_PROJECT_PATH" \
            -buildTarget Android \
            -executeMethod BattleHorizons.EditorTools.ProjectBootstrap.ConfigureFromCommandLine \
            -logFile /tmp/unity-configure.log || STEP_EXIT=$?

          if [[ ${STEP_EXIT:-0} -ne 0 ]]; then
            echo "::error::Unity project configuration failed with exit code $STEP_EXIT"
            if [[ -f /tmp/unity-configure.log ]]; then
              grep -n -E "(error CS|\[bh\]|Shader error|Exception|FAILED|Aborting batchmode|Error)" /tmp/unity-configure.log | tail -n 15 | while IFS= read -r line; do
                clean="${line//%/%25}"
                clean="${clean//$'\r'/}"
                echo "::error title=Configure Log::${clean}"
              done
              tail -n 120 /tmp/unity-configure.log
            fi
            exit 1
          fi

      - name: Edit-mode tests
        if: steps.licence.outputs.available == 'true'
        shell: bash
        env:
          UNITY_EDITOR_BIN: /home/runner/Unity/Hub/Editor/${{ env.UNITY_VERSION }}/Editor/Unity
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/unity-test-results/editmode"
          RESULTS_XML="$GITHUB_WORKSPACE/unity-test-results/editmode/results.xml"
          LOG_FILE="$GITHUB_WORKSPACE/unity-test-results/editmode/unity.log"

          xvfb-run --auto-servernum "$UNITY_EDITOR_BIN" \
            -batchmode \
            -nographics \
            -projectPath "$UNITY_PROJECT_PATH" \
            -runTests \
            -testPlatform EditMode \
            -testResults "$RESULTS_XML" \
            -logFile "$LOG_FILE" || TEST_EXIT=$?

          if [[ ${TEST_EXIT:-0} -ne 0 || ! -s "$RESULTS_XML" ]]; then
            echo "::error::Edit-mode tests failed (exit code ${TEST_EXIT:-0})"
            if [[ -s "$RESULTS_XML" ]]; then
              python3 -c 'import sys, xml.etree.ElementTree as ET; tree = ET.parse(sys.argv[1]); [print(f"::error title=EditMode {tc.attrib.get(\"name\")}::{(tc.findtext(\"failure/message\") or \"\").replace(chr(10), \" | \").replace(chr(13), \"\")}") for tc in tree.iter("test-case") if tc.attrib.get("result") == "Failed"]' "$RESULTS_XML" || true
            fi
            if [[ -f "$LOG_FILE" ]]; then
              grep -n -E "(error CS|Unhandled|NullReferenceException|AssertionException)" "$LOG_FILE" | tail -n 10 | while IFS= read -r line; do
                clean="${line//%/%25}"
                clean="${clean//$'\r'/}"
                echo "::error title=EditMode Log::${clean}"
              done
              tail -n 120 "$LOG_FILE"
            fi
            exit 1
          fi
          grep -E "<test-run " "$RESULTS_XML" || true

      - name: Play-mode tests
        if: steps.licence.outputs.available == 'true'
        shell: bash
        env:
          UNITY_EDITOR_BIN: /home/runner/Unity/Hub/Editor/${{ env.UNITY_VERSION }}/Editor/Unity
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/unity-test-results/playmode"
          RESULTS_XML="$GITHUB_WORKSPACE/unity-test-results/playmode/results.xml"
          LOG_FILE="$GITHUB_WORKSPACE/unity-test-results/playmode/unity.log"

          xvfb-run --auto-servernum "$UNITY_EDITOR_BIN" \
            -batchmode \
            -nographics \
            -projectPath "$UNITY_PROJECT_PATH" \
            -runTests \
            -testPlatform PlayMode \
            -testResults "$RESULTS_XML" \
            -logFile "$LOG_FILE" || TEST_EXIT=$?

          if [[ ${TEST_EXIT:-0} -ne 0 || ! -s "$RESULTS_XML" ]]; then
            echo "::error::Play-mode tests failed (exit code ${TEST_EXIT:-0})"
            if [[ -s "$RESULTS_XML" ]]; then
              python3 -c 'import sys, xml.etree.ElementTree as ET; tree = ET.parse(sys.argv[1]); [print(f"::error title=PlayMode {tc.attrib.get(\"name\")}::{(tc.findtext(\"failure/message\") or \"\").replace(chr(10), \" | \").replace(chr(13), \"\")}") for tc in tree.iter("test-case") if tc.attrib.get("result") == "Failed"]' "$RESULTS_XML" || true
            fi
            if [[ -f "$LOG_FILE" ]]; then
              grep -n -E "(error CS|Unhandled|NullReferenceException|AssertionException)" "$LOG_FILE" | tail -n 10 | while IFS= read -r line; do
                clean="${line//%/%25}"
                clean="${clean//$'\r'/}"
                echo "::error title=PlayMode Log::${clean}"
              done
              tail -n 120 "$LOG_FILE"
            fi
            exit 1
          fi
          grep -E "<test-run " "$RESULTS_XML" || true

      - name: Project validation (batch mode)
        if: steps.licence.outputs.available == 'true'
        shell: bash
        env:
          UNITY_EDITOR_BIN: /home/runner/Unity/Hub/Editor/${{ env.UNITY_VERSION }}/Editor/Unity
        run: |
          set -euo pipefail
          xvfb-run --auto-servernum "$UNITY_EDITOR_BIN" \
            -batchmode \
            -nographics \
            -quit \
            -projectPath "$UNITY_PROJECT_PATH" \
            -buildTarget Android \
            -executeMethod BattleHorizons.EditorTools.ProjectBootstrap.ValidateFromCommandLine \
            -logFile /tmp/unity-validate.log || VALIDATE_EXIT=$?

          if [[ ${VALIDATE_EXIT:-0} -ne 0 ]]; then
            echo "::error::Project validation failed with exit code $VALIDATE_EXIT"
            if [[ -f /tmp/unity-validate.log ]]; then
              grep -n -E "(\[bh\]|FAIL|Exception|error CS)" /tmp/unity-validate.log | tail -n 15 | while IFS= read -r line; do
                clean="${line//%/%25}"
                clean="${clean//$'\r'/}"
                echo "::error title=Validate Log::${clean}"
              done
              tail -n 120 /tmp/unity-validate.log
            fi
            exit 1
          fi

      - name: Build the Android APK
        id: apk
        if: steps.licence.outputs.available == 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build_apk))
        shell: bash
        env:
          UNITY_EDITOR_BIN: /home/runner/Unity/Hub/Editor/${{ env.UNITY_VERSION }}/Editor/Unity
          BH_BUILD_OUTPUT: ${{ github.workspace }}/build/battle-horizons.apk
          BH_KEYSTORE_PATH: ${{ steps.licence.outputs.signing_configured == 'true' && 'ci-keystore.jks' || '' }}
          BH_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS || secrets.KEYSTORE_PASS }}
          BH_KEYALIAS_NAME: ${{ secrets.ANDROID_KEYALIAS_NAME || secrets.KEYALIAS_NAME }}
          BH_KEYALIAS_PASS: ${{ secrets.ANDROID_KEYALIAS_PASS || secrets.KEYALIAS_PASS }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          EDITOR_DIR="$(dirname "$UNITY_EDITOR_BIN")"
          ANDROID_PLAYER="$EDITOR_DIR/Data/PlaybackEngines/AndroidPlayer"
          if [[ -d "$ANDROID_PLAYER" ]]; then
            export ANDROID_HOME="$ANDROID_PLAYER/SDK"
            export ANDROID_SDK_ROOT="$ANDROID_PLAYER/SDK"
            export ANDROID_NDK_HOME="$ANDROID_PLAYER/NDK"
            export ANDROID_NDK_ROOT="$ANDROID_PLAYER/NDK"
            export JAVA_HOME="$ANDROID_PLAYER/OpenJDK"
            export PATH="$JAVA_HOME/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          fi

          mkdir -p "$GITHUB_WORKSPACE/build" "${UNITY_PROJECT_PATH}/Builds"

          if [[ "${{ steps.licence.outputs.signing_configured }}" == "true" ]]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "${UNITY_PROJECT_PATH}/ci-keystore.jks"
          fi

          echo "Starting Unity Android APK build via host editor..."
          xvfb-run --auto-servernum "$UNITY_EDITOR_BIN" \
            -batchmode \
            -nographics \
            -quit \
            -projectPath "$UNITY_PROJECT_PATH" \
            -buildTarget Android \
            -executeMethod BattleHorizons.EditorTools.AndroidBuild.ConfigureValidateAndBuildApk \
            -buildVersion "0.1.${GITHUB_RUN_NUMBER}" \
            -androidVersionCode "${GITHUB_RUN_NUMBER}" \
            -androidTargetSdkVersion 35 \
            -logFile /tmp/unity-build.log || BUILD_EXIT=$?

          if [[ ${BUILD_EXIT:-0} -ne 0 ]]; then
            echo "::error::Unity APK build failed with exit code $BUILD_EXIT"
            if [[ -f /tmp/unity-build.log ]]; then
              grep -n -E "(\[bh\]|error CS|Shader error|BuildFailed|Exception|FAILED)" /tmp/unity-build.log | tail -n 15 | while IFS= read -r line; do
                clean="${line//%/%25}"
                clean="${clean//$'\r'/}"
                echo "::error title=Build Log::${clean}"
              done
              tail -n 120 /tmp/unity-build.log
            fi
            exit 1
          fi

          if [[ ! -s "$BH_BUILD_OUTPUT" && -s "${UNITY_PROJECT_PATH}/Builds/BattleHorizons.apk" ]]; then
            cp -f "${UNITY_PROJECT_PATH}/Builds/BattleHorizons.apk" "$BH_BUILD_OUTPUT"
          fi

          echo "Unity APK build completed successfully."

      - name: Remove the temporary keystore
        if: always() && steps.licence.outputs.available == 'true'
        run: |
          # The action writes the signing key into the project so Unity can find it.
          # It is never committed (.gitignore covers *.jks/*.keystore) and never
          # uploaded, but deleting it keeps the workspace clean either way.
          rm -f "${{ env.UNITY_PROJECT_PATH }}/ci-keystore.jks" || true

      - name: Verify the APK really exists and looks sane
        if: steps.licence.outputs.available == 'true' && steps.apk.outcome == 'success'
        run: |
          set -euo pipefail
          apk="$(find build -name '*.apk' -print -quit 2>/dev/null || true)"
          if [ -z "$apk" ] || [ ! -s "$apk" ]; then
            echo "::error::the build step reported success but produced no .apk"
            exit 1
          fi
          size=$(stat -c %s "$apk")
          echo "APK: $apk ($size bytes)"
          echo "::notice::APK size $size bytes"
          # Catch a missing/implausibly small package; Unity size still needs
          # review against the current Android budget before release.
          if [ "$size" -lt 1000000 ]; then
            echo "::error::the APK is $size bytes - that is not a real build"
            exit 1
          fi
          if command -v unzip >/dev/null 2>&1; then
            unzip -t "$apk" >/dev/null
            unzip -l "$apk" | grep -qE 'lib/arm64-v8a/' || {
              echo "::error::the APK has no arm64-v8a libraries"; exit 1; }
          fi
          echo "apk_path=$apk" >> "$GITHUB_OUTPUT"

      - name: Upload the APK
        if: steps.licence.outputs.available == 'true' && steps.apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: battle-horizons-unity-apk-${{ github.sha }}
          path: build/**/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload test results
        if: steps.licence.outputs.available == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-test-results-${{ github.sha }}
          path: unity-test-results/**
          retention-days: 14
          if-no-files-found: warn
