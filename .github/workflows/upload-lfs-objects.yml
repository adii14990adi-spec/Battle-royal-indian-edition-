name: Upload LFS objects (temporary, one-time)

# One-time migration helper. Item B of the fix branch converts six PNGs from
# plain Git blobs into LFS pointers via `git add --renormalize`; the objects
# themselves have to exist in GitHub's LFS storage before that push lands, or
# the `lfs: true` CI checkouts would see unresolved pointers. The sandbox that
# authored the change cannot reach GitHub's LFS storage endpoint (S3 and
# lfs.github.com are blocked there), so the upload runs from this
# GitHub-hosted runner instead. The follow-up push that carries the actual
# fixes deletes this workflow.

on:
  push:
    branches: ['arena/**']
    paths:
      - '.github/workflows/upload-lfs-objects.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upload-lfs-objects-${{ github.ref }}
  cancel-in-progress: false

jobs:
  upload:
    name: Upload the six PNG LFS objects
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository (full history, no LFS smudge)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          lfs: false

      - name: Upload objects and verify every PNG oid is served
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: d39a6c86ef9a7e7ba6260d13f97b5d5e5ccff4d2
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, subprocess, sys, time, urllib.request

          BASE = os.environ["BASE_SHA"]
          TOKEN = os.environ["GH_TOKEN"]
          REPO = os.environ["GITHUB_REPOSITORY"]
          BATCH = f"https://github.com/{REPO}.git/info/lfs/objects/batch"
          AUTH = "Basic " + base64.b64encode(f"x-access-token:{TOKEN}".encode()).decode()
          HEADERS = {
              "Accept": "application/vnd.git-lfs+json",
              "Content-Type": "application/vnd.git-lfs+json",
              "Authorization": AUTH,
          }

          PATHS = [
              "unity-project/Assets/Resources/Art/Textures/water_normal_256.png",
              "unity-project/Assets/Resources/UI/battle_horizons_logo.png",
              "unity-project/Assets/Resources/UI/battle_horizons_loading_bar.png",
              "unity-project/Assets/Resources/UI/battle_horizons_loading_spinner.png",
              "unity-project/Assets/UI/Icons/battle_horizons_icon.png",
              "docs/images/siran_island_layout_prototype.png",
          ]
          PREVIEW = "docs/images/siran_island_preview.png"

          def batch(operation, oid, size):
              body = json.dumps({
                  "operation": operation,
                  "transfers": ["basic"],
                  "hash_algo": "sha256",
                  "objects": [{"oid": oid, "size": size}],
              }).encode()
              req = urllib.request.Request(BATCH, data=body, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=60) as resp:
                  payload = json.load(resp)
              return payload["objects"][0]

          def pointer_oid_size(blob):
              oid = size = None
              for line in blob.decode("ascii", "replace").splitlines():
                  if line.startswith("oid sha256:"):
                      oid = line.split(":", 1)[1]
                  elif line.startswith("size "):
                      size = int(line.split(" ", 1)[1])
              if not oid or size is None:
                  raise SystemExit(f"{PREVIEW}: blob is not an LFS pointer")
              return oid, size

          failures = []

          for rel in PATHS:
              content = subprocess.check_output(["git", "show", f"{BASE}:{rel}"])
              oid = hashlib.sha256(content).hexdigest()
              size = len(content)
              obj = batch("upload", oid, size)
              actions = obj.get("actions") or {}
              upload = actions.get("upload")
              if upload is None:
                  if "error" in obj:
                      failures.append(f"{rel}: batch upload error {obj['error']}")
                      continue
                  print(f"already stored: {rel} oid={oid} size={size}")
                  continue
              headers = dict(upload.get("header") or {})
              req = urllib.request.Request(upload["href"], data=content, method="PUT", headers=headers)
              with urllib.request.urlopen(req, timeout=300) as resp:
                  if resp.status not in (200, 201):
                      failures.append(f"{rel}: PUT returned {resp.status}")
                      continue
              verify = actions.get("verify")
              if verify:
                  vheaders = dict(verify.get("header") or {})
                  vheaders.setdefault("Content-Type", "application/vnd.git-lfs+json")
                  vbody = json.dumps({"oid": oid, "size": size}).encode()
                  req = urllib.request.Request(verify["href"], data=vbody, method="POST", headers=vheaders)
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      if resp.status not in (200, 201, 204):
                          failures.append(f"{rel}: verify returned {resp.status}")
                          continue
              print(f"uploaded: {rel} oid={oid} size={size}")

          if failures:
              print("::error::upload failures: " + "; ".join(failures))
              sys.exit(1)

          # Verify every pointer oid the follow-up push will commit resolves to
          # a download action (i.e. is stored server-side), including the
          # preview PNG whose pointer already exists in history.
          checks = []
          for rel in PATHS:
              content = subprocess.check_output(["git", "show", f"{BASE}:{rel}"])
              checks.append((rel, hashlib.sha256(content).hexdigest(), len(content)))
          checks.append((PREVIEW, *pointer_oid_size(subprocess.check_output(["git", "show", f"{BASE}:{PREVIEW}"]))))

          missing = []
          for attempt in range(10):
              missing = []
              for rel, oid, size in checks:
                  obj = batch("download", oid, size)
                  if "download" not in (obj.get("actions") or {}):
                      missing.append(f"{rel} ({oid[:10]})")
              if not missing:
                  break
              print(f"attempt {attempt + 1}: not yet served: {', '.join(missing)}")
              time.sleep(3)

          if missing:
              print("::error::LFS objects missing after upload: " + ", ".join(missing))
              sys.exit(1)

          print("all 7 PNG object oids resolve to LFS download actions")
          PY
