name: "GLTF import test integrity (static)"

# STATIC ONLY. This workflow never opens Unity, never imports a glTF, never
# claims visual playback and never builds an APK. The licensed Unity 6 checks
# live in unity.yml's licence-gated `unity` job.

on:
  push:
    branches: [main, develop, 'arena/**']
    paths:
      - 'unity-project/Assets/Characters/GLTF_Import_Test/**'
      - 'unity-project/Assets/Tests/**'
      - 'unity-project/Packages/manifest.json'
      - 'processing/unity/**'
      - 'docs/GLTF_PLAYER_IMPORT_TEST_REPORT.md'
      - 'docs/gltf_import_test/**'
      - '.github/workflows/validate-gltf-import-test.yml'
      - '.github/workflows/unity.yml'
      # Generated by the optional visual-capture dispatch; do not retrigger.
      - '!docs/gltf_import_test/screenshots/**'
      - '!unity-project/Assets/Characters/GLTF_Import_Test/GLTF_Player_Import_Test.unity'
  pull_request:
    branches: [main, develop]
    paths:
      - 'unity-project/Assets/Characters/GLTF_Import_Test/**'
      - 'unity-project/Assets/Tests/**'
      - 'unity-project/Packages/manifest.json'
      - 'processing/unity/**'
      - 'docs/GLTF_PLAYER_IMPORT_TEST_REPORT.md'
      - 'docs/gltf_import_test/**'
      - '.github/workflows/validate-gltf-import-test.yml'
      - '.github/workflows/unity.yml'
      # Generated by the optional visual-capture dispatch; do not retrigger.
      - '!docs/gltf_import_test/screenshots/**'
      - '!unity-project/Assets/Characters/GLTF_Import_Test/GLTF_Player_Import_Test.unity'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gltf-import-static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: "Exact source, URI, GUID, skeleton and protected-asset checks"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install C# static-analysis dependencies
        run: python3 -m pip install --disable-pip-version-check tree-sitter tree-sitter-c-sharp

      - name: Isolated GLTF static validation
        run: |
          python3 processing/unity/validate_gltf_import_test.py \
            --json static-gltf-import-test.json \
            --report static-gltf-import-test.md
          cat static-gltf-import-test.md >> "$GITHUB_STEP_SUMMARY"

      - name: FBX reader + GLTF static validator unit tests
        run: python3 -m unittest discover -s processing/unity/tests -v

      - name: Repository structure
        run: python3 processing/unity/validate_structure.py

      - name: C# syntax and assembly-reference checks (no Unity compiler)
        run: python3 processing/unity/validate_csharp.py

      - name: Blender pipeline unit tests
        run: python3 -m unittest discover -s processing/blender/tests -v

      - name: Upload static reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gltf-import-static-${{ github.sha }}
          path: |
            static-gltf-import-test.json
            static-gltf-import-test.md
          if-no-files-found: warn
          retention-days: 14

      - name: Editor-only boundary (never a pass)
        if: always()
        run: |
          {
            echo "### Verification boundary"
            echo ""
            echo "This workflow is **static only**. It did NOT run Unity Editor,"
            echo "import a glTF, generate an Avatar, play an animation, render a"
            echo "screenshot, compile C# with Unity, build an APK or measure a device."
            echo ""
            echo "Licensed Unity Editor validation runs in \`unity.yml\` only when"
            echo "Unity Personal/Professional secrets are configured. Visual capture"
            echo "is an explicit \`workflow_dispatch(capture_screenshots=true)\` step."
            echo ""
            echo "See \`docs/GLTF_PLAYER_IMPORT_TEST_REPORT.md\`."
          } >> "$GITHUB_STEP_SUMMARY"
