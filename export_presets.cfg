[preset.0]

name="Android_APK_Unisoc"
platform="Android"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
; export_filter=all_resources builds its list from the *editor's* scanned
; filesystem. That scan is why the old CI bake shipped APKs with no world: the
; chunk scenes were written after the last scan and could be left out entirely,
; so the APK installed, the boot screen worked, and "Enter Siran Island" showed
; MISSING BAKE. The map is now a committed scene
; (scenes/world/siran_island_baked.tscn), so it is scanned like any other file —
; include_filter is the second, independent defence, applied by walking the real
; directory tree (EditorExportPlatform::_edit_files_with_filter -> DirAccess), so
; every *.tscn / *.res / *.scn on disk is packed whatever the scan thinks.
; Godot config files have exactly one comment character: ';'. A '#' line is not
; a comment, it is a parse error, and Godot then cannot read the preset at all.
include_filter="*.tscn,*.res,*.scn,*.tres,*.gd,scenes/world/*,resources/world/*"
exclude_filter=""
export_path="build/battle-horizons.apk"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

